distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 官方 GitHub 镜像（gradle/gradle-distributions release 资产，与 services.gradle.org 同一字节件）：
# 2026-08-25 起 GH runner 到 services.gradle.org 链路间歇 Connection refused，连挂多次卡死 CI
distributionUrl=https\://github.com/gradle/gradle-distributions/releases/download/v9.7.0/gradle-9.7.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
