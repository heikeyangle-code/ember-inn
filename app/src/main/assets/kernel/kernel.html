<!DOCTYPE html>
<!--
  EmberInn RenderKernel v0.1
  官方资产基线：SillyTavern release 8172dcd (1.18.0)
  职责：以与官方逐字节相同的 CSS/JS 渲染单条消息。
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <!-- 安全策略：放开模式（用户决策）。允许外链媒体/网络/脚本。 -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src * data: blob: about:; style-src * 'unsafe-inline'; script-src * 'unsafe-inline'; img-src * data: blob:; media-src * data: blob:; font-src * data:; connect-src *; frame-src *;">
    <link rel="stylesheet" href="official/webfonts/NotoSans/stylesheet.css">
    <link rel="stylesheet" href="official/webfonts/NotoSansMono/stylesheet.css">
    <link rel="stylesheet" href="official/css/fontawesome.min.css">
    <link rel="stylesheet" href="official/css/solid.min.css">
    <link rel="stylesheet" href="official/css/brands.min.css">
    <link rel="stylesheet" href="official/css/style.css">
    <link rel="stylesheet" href="official/css/mobile-styles.css">
    <style id="custom-style" type="text/css"></style>
    <style id="app-host-actions-style">
        /* app-host-actions：消息交互由原生宿主承担（长按菜单/操作条/swipe 手势），
         * 官方模板中对应的死控件隐藏——DOM 结构保持与官方逐字节同构，只藏不删。 */
        body.app-host-actions .mes_buttons,
        body.app-host-actions .extraMesButtonsHint,
        body.app-host-actions .swipe_left,
        body.app-host-actions .swipe_right,
        body.app-host-actions .swipes-counter,
        body.app-host-actions .mes_reasoning_actions,
        body.app-host-actions .del_checkbox,
        body.app-host-actions .for_checkbox,
        body.app-host-actions .mes_edit_buttons { display: none !important; }
    </style>
    <style id="app-host-shell-style">
        /* 嵌入态壳级覆盖：官方 #sheld/#chat 布局假定整页应用壳（顶栏/输入栏、绝对定位、
         * 视口高裁剪、#chat 内部滚动）。单消息渲染页没有这些壳——若照搬，#chat 的
         * max-height(100vh)+overflow-y:scroll 会把超屏消息裁进内部滚动框。
         * 这里只解除定位与滚动语义；宽度语义与主题包装饰规则全部保留
         * （Moonlit #sheld::before 背景/padding、@media 移动端 100dvw 铺满等照常生效），
         * 高度由 ResizeObserver 全量回报宿主。 */
        html, body { height: auto; overflow: visible; }
        #sheld {
            position: static !important;
            top: auto !important;
            left: auto !important;
            right: auto !important;
            bottom: auto !important;
            width: 100% !important;
            height: auto !important;
            max-height: none !important;
            min-height: 0 !important;
            margin: 0 !important;
        }
        #chat {
            max-height: none !important;
            overflow: visible !important;
            bottom: auto !important;
        }
    </style>
</head>
<body class="light-theme">
    <!-- 官方 style.css 与主题包依赖 #sheld > #chat 层级（#sheld 背景/padding/移动端铺满规则），
         结构同构；壳级定位差异由 app-host-shell-style 嵌入态覆盖处理 -->
    <div id="sheld">
        <div id="chat">
            <div id="mes_stop" class="fa-solid fa-circle-stop stop_generation_button" title="Abort generation" style="display:none;"></div>
        </div>
    </div>

    <script src="js/showdown.min.js"></script>
    <script src="js/css-tools.min.js"></script>
    <script src="js/dompurify.min.js"></script>
    <script src="js/highlight.min.js"></script>
    <script src="js/st-extensions.js"></script>
    <script src="js/st-api-shim.js"></script>
    <script src="js/render.js"></script>
</body>
</html>
