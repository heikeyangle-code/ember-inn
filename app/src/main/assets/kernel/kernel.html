<!DOCTYPE html>
<!--
  EmberInn RenderKernel v0.1
  官方资产基线：SillyTavern release 8172dcd (1.18.0)
  职责：以与官方逐字节相同的 CSS/JS 渲染单条消息。
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <!-- 安全策略：放开模式（用户决策）。允许外链媒体/网络/脚本。 -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src * data: blob: about:; style-src * 'unsafe-inline'; script-src * 'unsafe-inline'; img-src * data: blob:; media-src * data: blob:; font-src * data:; connect-src *; frame-src *;">
    <link rel="stylesheet" href="official/webfonts/NotoSans/stylesheet.css">
    <link rel="stylesheet" href="official/webfonts/NotoSansMono/stylesheet.css">
    <link rel="stylesheet" href="official/css/fontawesome.min.css">
    <link rel="stylesheet" href="official/css/solid.min.css">
    <link rel="stylesheet" href="official/css/brands.min.css">
    <!-- 官方主样式在站点根（public/style.css），其头部 @import url(css/*.css) 相对自身解析；
         这里保持同构布局：style.css 置 official/ 根、16 个子样式表置 official/css/，导入链逐字生效 -->
    <link rel="stylesheet" href="official/style.css">
    <link rel="stylesheet" href="official/css/mobile-styles.css">
    <link rel="stylesheet" href="official/css/toggle-dependent.css">
    <!-- 官方弹层样式（lightbox img_enlarged 走 .popup dialog 体系，chats.js expandMessageMedia） -->
    <link rel="stylesheet" href="official/css/popup.css">
    <style id="custom-style" type="text/css"></style>
    <style id="app-host-actions-style">
        /* 整页壳官方化：官方消息按钮/swipe/删除框全部保留。
         * 交互经内核点击桥回宿主执行；不再用 app-host-actions 藏官方控件。 */
        body.app-host-actions .mes_reasoning_actions,
        body.app-host-actions .mes_edit_buttons { display: none !important; }
    </style>
    <style id="app-host-shell-style">
        /* 嵌入态壳级覆盖：官方 #sheld/#chat 布局假定整页应用壳（顶栏/输入栏、绝对定位、
         * 视口高裁剪、#chat 内部滚动）。单消息渲染页没有这些壳——若照搬，#chat 的
         * max-height(100vh)+overflow-y:scroll 会把超屏消息裁进内部滚动框。
         * 这里只解除定位与滚动语义；宽度语义与主题包装饰规则全部保留
         * （Moonlit #sheld::before 背景/padding、@media 移动端 100dvw 铺满等照常生效），
         * 高度由 ResizeObserver 全量回报宿主。 */
        html, body { height: auto; overflow: visible; }
        #sheld {
            position: static !important;
            top: auto !important;
            left: auto !important;
            right: auto !important;
            bottom: auto !important;
            width: 100% !important;
            height: auto !important;
            max-height: none !important;
            min-height: 0 !important;
            margin: 0 !important;
        }
        #chat {
            max-height: none !important;
            overflow: visible !important;
            bottom: auto !important;
        }

        /* 整页壳模式（C1/C2）：宿主给 body 加 fullchat 类——官方滚动语义恢复，
         * #chat 成为唯一滚动容器。上方嵌入态覆盖与本块同为 !important，
         * 后声明者胜出，故本块放同一样式表末尾。#sheld 回到 fixed 全屏
         * （官方整页壳定位），主题包装饰规则（#sheld::before 等）不受影响。 */
        body.fullchat #sheld {
            position: fixed !important;
            /* 长手属性逐项显式(inset 简写老 WebView 不支持;含 0 兜底防塌缩) */
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            /* 官方移动端语义:#sheld 铺满视口(--sheldWidth 仅桌面居中列);
               left/right 双锚定 + width auto,主题变量不再压缩宽度 */
            width: auto !important;
            height: 100vh !important;
            max-height: none !important;
            margin: 0 !important;
            padding: 0 !important;
            /* 官方 style.css #sheld 同构:flex 列布局,chat 弹性占满、form_sheld 沉底 */
            display: flex !important;
            flex-direction: column !important;
            justify-content: flex-start !important;
        }
        body.fullchat #chat {
            flex: 1 1 auto !important;
            min-height: 0 !important;
            height: auto !important;
            max-height: none !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            bottom: auto !important;
            /* 触摸滚动:惯性(-webkit-overflow-scrolling)+阻止滚动链穿透到宿主 */
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        body.fullchat #form_sheld {
            position: relative !important;
            flex: 0 0 auto !important;
            width: 100% !important;
            bottom: auto !important;
        }
        /* 滚动性能:backdrop-filter 每帧重算是大面积玻璃主题的掉帧主凶;
           滚动期间整体挂起,停止 150ms 后由 JS 摘类恢复 */
        body.is-scrolling #sheld,
        body.is-scrolling #chat *,
        body.is-scrolling #form_sheld * {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            transition: none !important;
        }
    </style>
</head>
<body class="light-theme fullchat">
    <!-- C4 官方背景层（index.html L53 / backgrounds.css）：#sheld 的 backdrop-filter 玻璃语义直接作用于它 -->
    <div id="bg1"></div>
    <!-- 官方 style.css 与主题包依赖 #sheld > #chat > #form_sheld 层级（#sheld 背景/padding/
         移动端铺满规则、#form_sheld 底部输入区），结构逐字节同构 index.html L8069-8113；
         壳级定位差异由 app-host-shell-style fullchat 覆盖处理。
         文案按应用语言（中文）本地化；DOM/类名/title 结构保持官方原样。 -->
    <div id="sheld">
        <div id="sheldheader" class="fa-solid fa-grip drag-grabber"></div>
        <div id="chat">
        </div>
        <div id="form_sheld">
            <div id="dialogue_del_mes">
                <div id="dialogue_del_mes_ok" data-i18n="Delete" class="menu_button">删除</div>
                <div id="dialogue_del_mes_cancel" data-i18n="Cancel" class="menu_button">取消</div>
            </div>
            <div id="send_form" class="no-connection">
                <form id="file_form" class="wide100p displayNone">
                    <div class="file_attached">
                        <input id="file_form_input" type="file" multiple hidden>
                        <input id="embed_file_input" type="file" multiple hidden>
                        <i class="fa-solid fa-file-alt"></i>
                        <span class="file_name">File Name</span>
                        <span class="file_size">File Size</span>
                        <button id="file_form_reset" type="reset" class="menu_button" title="移除文件" data-i18n="[title]Remove the file">
                            <i class="fa fa-times"></i>
                        </button>
                    </div>
                </form>
                <div id="nonQRFormItems">
                    <div id="leftSendForm" class="alignContentCenter">
                        <div id="options_button" class="fa-solid fa-bars interactable"></div>
                        <!-- Ember 附件入口：复用官方 #leftSendForm>div 官方样式；无官方同位控件 -->
                        <div id="attach_button" class="fa-solid fa-paperclip interactable"></div>
                    </div>
                    <textarea id="send_textarea" name="text" class="mdHotkeys" placeholder="输入消息…" autocomplete="off"></textarea>
                    <div id="rightSendForm" class="alignContentCenter">
                        <div id="stscript_continue" title="继续执行脚本" class="stscript_btn stscript_continue" data-i18n="[title]Continue script execution">
                            <i class="fa-solid fa-play"></i>
                        </div>
                        <div id="stscript_pause" title="暂停脚本执行" class="stscript_btn stscript_pause" data-i18n="[title]Pause script execution">
                            <i class="fa-solid fa-pause"></i>
                        </div>
                        <div id="stscript_stop" title="中止脚本执行" class="stscript_btn stscript_stop" data-i18n="[title]Abort script execution">
                            <i class="fa-solid fa-stop"></i>
                        </div>
                        <div id="mes_stop" title="中断请求" class="mes_stop" data-i18n="[title]Abort request">
                            <i class="fa-solid fa-circle-stop"></i>
                        </div>
                        <div id="mes_impersonate" class="fa-solid fa-user-secret interactable displayNone" title="让 AI 代写你的发言" data-i18n="[title]Ask AI to write your message for you" tabindex="0"></div>
                        <div id="mes_continue" class="fa-fw fa-solid fa-arrow-right interactable displayNone" title="继续上一条消息" data-i18n="[title]Continue the last message"></div>
                        <div id="send_but" class="fa-solid fa-paper-plane interactable displayNone" title="发送消息" data-i18n="[title]Send a message"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 官方媒体模板（index.html L7670/L7692 逐字节）：appendMediaToMessage clone 源 -->
    <div id="message_image_template" class="template_element">
        <div class="mes_media_container mes_img_container">
            <div class="mes_img_controls">
                <div title="Expand and zoom" class="right_menu_button fa-lg fa-solid fa-magnifying-glass mes_media_enlarge" data-i18n="[title]Expand and zoom"></div>
                <div title="Caption" class="right_menu_button fa-lg fa-solid fa-envelope-open-text mes_img_caption" data-i18n="[title]Caption"></div>
                <div title="Delete" class="right_menu_button fa-lg fa-solid fa-trash-can mes_media_delete" data-i18n="[title]Delete"></div>
            </div>
            <img class="mes_img" src="" />
        </div>
    </div>

    <!-- 官方 index.html L7687-7698 原样（缩进适配） -->
    <div id="message_video_template" class="template_element">
        <div class="mes_media_container mes_video_container">
            <div class="mes_video_controls">
                <div title="Expand and zoom" class="right_menu_button fa-lg fa-solid fa-magnifying-glass mes_media_enlarge" data-i18n="[title]Expand and zoom"></div>
                <div title="Caption" class="right_menu_button fa-lg fa-solid fa-envelope-open-text mes_img_caption" data-i18n="[title]Caption"></div>
                <div title="Delete" class="right_menu_button fa-lg fa-solid fa-trash-can mes_media_delete" data-i18n="[title]Delete"></div>
            </div>
            <video class="mes_video" controls preload="metadata"></video>
        </div>
    </div>

    <div id="message_gallery_controls" class="template_element">
        <div class="mes_img_swipes">
            <div title="Swipe left" class="right_menu_button fa-lg fa-solid fa-chevron-left mes_img_swipe_left" data-i18n="[title]Swipe left"></div>
            <div class="mes_img_swipe_counter">1/1</div>
            <div title="Swipe right" class="right_menu_button fa-lg fa-solid fa-chevron-right mes_img_swipe_right" data-i18n="[title]Swipe right"></div>
        </div>
    </div>

    <!-- 官方 index.html L7700-7727 原样（缩进适配）。注意：官方 file-form.css 的播放器样式
         并未被 index.html 引用——官方消息内音频就是无专属样式 + AudioPlayer 行为，照抄不加。 -->
    <div id="message_audio_template" class="template_element">
        <div class="mes_media_container mes_audio_container audio-player">
            <audio class="mes_audio" preload="auto" hidden></audio>
            <div class="audio-player-header">
                <div class="audio-player-title">Audio</div>
                <div class="right_menu_button mes_media_delete fa-fw fa-solid fa-trash-can" title="Delete" data-i18n="[title]Delete"></div>
            </div>
            <div class="audio-player-controls">
                <button class="audio-player-play-pause right_menu_button fa-fw fa-solid fa-play" title="Play" data-i18n="[title]Play"></button>
                <div class="audio-player-time">
                    <span class="audio-player-current-time">0:00</span>
                    <span class="audio-player-time-separator">/</span>
                    <span class="audio-player-total-time">0:00</span>
                </div>
                <div class="audio-player-progress">
                    <div class="audio-player-progress-bar"></div>
                </div>
                <div class="audio-player-volume-control">
                    <button class="audio-player-volume right_menu_button fa-fw fa-solid fa-volume-high" title="Mute" data-i18n="[title]Mute"></button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/audio-player.js"></script>
    <script src="js/showdown.min.js"></script>
    <script src="js/css-tools.min.js"></script>
    <script src="js/dompurify.min.js"></script>
    <script src="js/highlight.min.js"></script>
    <script src="js/st-extensions.js"></script>
    <script src="js/st-api-shim.js"></script>
    <!-- 酒馆助手兼容层（独立模块，构建在 shim 全局之上；渲染挂接走 MutationObserver 零侵入） -->
    <script src="js/tavern-helper.js"></script>
    <script src="js/render.js"></script>
</body>
</html>
