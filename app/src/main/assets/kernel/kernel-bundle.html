/* Fade animations with opacity */
@keyframes fade-in {
    0% {
        opacity: 0;
    }

    100% {
        opacity: 1;
    }
}

@keyframes fade-out {
    0% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

/* Pop animations with opacity and vertical scaling */
@keyframes pop-in {
    0% {
        opacity: 0;
        transform: scaleY(0);
    }

    /* Make the scaling faster on pop-in, otherwise it looks a bit weird */
    33% {
        transform: scaleY(1);
    }

    100% {
        opacity: 1;
        transform: scaleY(1);
    }
}

@keyframes pop-out {
    0% {
        opacity: 1;
        transform: scaleY(1);
    }

    66% {
        transform: scaleY(1);
    }

    100% {
        opacity: 0;
        transform: scaleY(0);
    }
}

@keyframes flash {

    0%,
    50%,
    100% {
        opacity: 1;
    }

    75% {

    }
}

@keyframes pulse {
    from {
        transform: scale(1);
        filter: brightness(1.1);
    }

    to {
        transform: scale(1.01);
        filter: brightness(1.3);
    }
}

    }

        content: "."
    }

/* ===== css/popup.css ===== */
@import url('/lib/dialog-polyfill.css');
@import url(official/popup-safari-fix.css);

dialog {
    color: var(--SmartThemeBodyColor);
}

/* Closed state of the dialog */
.popup {
    width: 500px;
    text-align: center;
    box-shadow: 0px 0px 14px var(--black70a);
    border: 1px solid var(--SmartThemeBorderColor);
    padding: 4px 14px;
    background-color: var(--SmartThemeBlurTintColor);
    border-radius: 10px;
    display: flex;
    flex-direction: column;

    max-height: calc(100dvh - 2em);
    max-width: calc(100dvw - 2em);
    min-height: fit-content;

    /* Overflow visible so elements (like toasts) can appear outside of the dialog. '.popup-body' is hiding overflow for the real content. */
    overflow: visible;

    /* Fix weird animation issue with font-scaling during popup open */
    backface-visibility: hidden;
    -webkit-font-smoothing: subpixel-antialiased;

    /* Variables setup */
    --popup-animation-speed: var(--animation-duration-slow);
}

/** Popup styles applied to the main popup */
.popup--animation-fast {
    --popup-animation-speed: var(--animation-duration);
}

.popup--animation-slow {
    --popup-animation-speed: var(--animation-duration-slow);
}

.popup--animation-none {
    --popup-animation-speed: 0ms;
}

/* Styling of main popup elements */
.popup .popup-body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    width: min(100%, 100vw);
    height: 100%;
    padding: 1px;
}

.popup:not(:has(.img_enlarged_container)) .popup-body {
    max-height: 95dvh;
}

.popup .popup-content {
    margin-top: 10px;
    padding: 0 8px;
    overflow: hidden;
    flex-grow: 1;
}

.popup .popup-content h3:first-child {
    /* No double spacing for the first heading needed, the .popup-content already has margin */
    margin-top: 0px;
}

.popup.vertical_scrolling_dialogue_popup .popup-content {
    overflow-y: auto;
}

.popup.horizontal_scrolling_dialogue_popup .popup-content {
    overflow-x: auto;
}

.popup.left_aligned_dialogue_popup .popup-content {
    text-align: start;
}

/* Opening animation */
.popup[opening] {
    animation: pop-in var(--popup-animation-speed) ease-in-out;
}

.popup[opening]::backdrop {
    animation: fade-in var(--popup-animation-speed) ease-in-out;
}

/* Fix toast container snapping into the backdrop while the animation is running */
.popup[opening] #toast-container {
    visibility: hidden;

/* Open state of the dialog */
.popup[open] {
    color: var(--SmartThemeBodyColor);

.popup[open]::backdrop {
    backdrop-filter: blur(calc(var(--SmartThemeBlurStrength) * 2));

}

    backdrop-filter: none;
    -webkit-backdrop-filter: none;
}

/* Closing animation */
.popup[closing] {
    animation: pop-out var(--popup-animation-speed) ease-in-out;

.popup[closing]::backdrop {
    animation: fade-out var(--popup-animation-speed) ease-in-out;

/* ===== css/loader.css ===== */
#preloader {
    position: fixed;
    margin: 0;
    padding: 0;
    top: 0;
    left: 0;
    z-index: 999999;
    width: 100vw;
    height: 100vh;
    width: 100dvw;
    height: 100dvh;
    background-color: var(--SmartThemeBlurTintColor);
    color: var(--SmartThemeBodyColor);
    /*for some reason the full screen blur does not work on iOS*/
    backdrop-filter: blur(30px);
    opacity: 1;
}

#load-spinner {
    --spinner-size: 2em;
    transition: all var(--animation-duration-2x) ease-out;
    opacity: 1;
    top: calc(50% - var(--spinner-size) / 2);
    left: calc(50% - var(--spinner-size) / 2);
    position: absolute;
    width: var(--spinner-size);
    height: var(--spinner-size);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Action loader toast styles */
.action-loader-toast {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
}

.action-loader-message {
    flex: 1;
}

.action-loader-stop {
    cursor: pointer;
    font-size: 1.2em;
    opacity: 0.8;
    transition: opacity 0.15s ease, color 0.15s ease;
}

.action-loader-stop:hover {
    opacity: 1;
    color: color-mix(in srgb, currentColor 40%, #e74c3c 60%);
}

/* Splash screen styles for branded loading */
#loader.splash-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4rem;
    width: 100%;
    height: 100%;
    transition: all var(--animation-duration-2x) ease-out;
}

#loader.splash-screen #load-spinner {
    position: static;
    top: unset;
    left: unset;
}

.splash-logo {
    /* max original px, or 50% on mobile */
    width: min(150px, 50%);
    height: auto;
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
}

.splash-message {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 500;
    opacity: 0.9;
    letter-spacing: 0.02em;
}

/* ===== css/tags.css ===== */

#tags_div {

.tag_controls {

    gap: 5px;

}

.tag_view_item {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    margin-bottom: 5px;
}

.tag_view_name {
    text-align: left;
}

.tag_view_counter {
    text-align: right;
    flex: 1;
}

.tag_view_color_picker {
    position: relative;
}

.tag_view_color_picker .link_icon {
    position: absolute;
    top: 50%;
    right: 0px;
    opacity: 0.5;
}

.tag_delete {
    padding: 2px 4px;

}

.tag {
    border-radius: 5px;
    border-style: solid;
    border-width: 1px;
    box-sizing: border-box;
    color: var(--SmartThemeBodyColor);
    background-color: var(--black30a);
    border-color: var(--white50a);
    padding: 0.1rem 0.2rem;
    font-size: calc(var(--mainFontSize) - 5%);
    display: flex;
    flex-direction: row;
    align-items: center;
    position: relative;
    gap: 10px;
    width: fit-content;
    min-width: 0;
    text-shadow: none !important;
}

.rm_tag_filter .tag:not(.actionable) {
    display: none;
}

.tag.tag-absent {
    text-decoration: line-through;
}

.tag.actionable {
    border-radius: 50%;
    aspect-ratio: 1 / 1;
    min-height: calc(var(--mainFontSize) * 2);
    min-width: calc(var(--mainFontSize) * 2);
    font-size: calc(var(--mainFontSize) * 1);
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

.tag.actionable.clearAllFilters {
    border: 0;
    background: none;
}

.tag.placeholder-expander {
    cursor: alias;
    border: 0;
}

.tagListHint {
    align-self: center;
    display: flex;
    margin-right: 10px;
}

.tag_remove {
    cursor: pointer;
}

.tags {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: flex-start;
    gap: 0.2rem;
    align-items: flex-end;
}

#bulkTagsList,
#tagList.tags {
    margin: 5px 0;
}

#bulkTagsList,
#tagList .tag,
#groupTagList .tag {
    opacity: 0.6;
}

#tagList .tag:has(.tag_remove:hover) {
    opacity: 1;
}

#tagList .tag:has(.tag_remove:hover) .tag_name {
    opacity: 0.6;
}

.tags.tags_inline {
    opacity: 0.6;
    column-gap: 0.2rem;
    row-gap: 0.2rem;
    justify-content: flex-start;
    max-height: 66%;
    overflow: hidden;
    flex-basis: 100%;
}

.tag_name {
    text-overflow: ellipsis;
    overflow: hidden;
    text-align: left;
    white-space: nowrap;
    text-shadow: none !important;
}

.tags_inline .tag {
    font-size: calc(var(--mainFontSize) - 15%);
    padding: 0 0.15rem;
}

.rm_tag_controls {
    display: flex;
    column-gap: 10px;
    row-gap: 5px;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: flex-start;
    margin-top: 5px;
    max-height: 40dvh;
    overflow-y: auto;
}

.rm_tag_filter .tag {
    cursor: pointer;
    opacity: 0.6;
    filter: brightness(0.8);
}

.rm_tag_filter .tag.actionable {
    transition: opacity var(--animation-duration-2x);
}

.rm_tag_filter .tag:hover {
    opacity: 1;
    filter: brightness(1);
}

.tags_view {
    margin: 0;
    aspect-ratio: 1 / 1;
}

.tag.selected {
    opacity: 1 !important;
    filter: none !important;
}

.tag.excluded {
    opacity: 1 !important;
    filter: saturate(0.4) !important;
    border: 1px solid red;
}

.tag.excluded::after {
    position: absolute;
    height: calc(var(--mainFontSize)*1.5);
    left: 0;
    right: 0;
    content: "\d7";
    pointer-events: none;
    font-size: calc(var(--mainFontSize) *3);
    color: red;
    line-height: calc(var(--mainFontSize)*1.3);
    text-align: center;
    text-shadow: 1px 1px 0px black,
        -1px -1px 0px black,
        -1px 1px 0px black,
        1px -1px 0px black;
    opacity: 1;
}

.tag_as_folder.right_menu_button {
    filter: brightness(75%) saturate(0.6);
    margin-right: 5px;
}

.tag_as_folder.right_menu_button:hover,
.tag_as_folder.right_menu_button.flash {
    filter: brightness(150%) saturate(0.6);
}

.tag_as_folder.right_menu_button.no_folder {
    filter: brightness(25%) saturate(0.25);
}

.tag_as_folder.right_menu_button .tag_folder_indicator {
    position: absolute;
    top: calc(var(--mainFontSize) * -0.5);
    right: calc(var(--mainFontSize) * -0.5);
    font-size: calc(var(--mainFontSize) * 1);
    line-height: calc(var(--mainFontSize) * 1.3);
    text-align: center;
    text-shadow: 1px 1px 0px black,
        -1px -1px 0px black,
        -1px 1px 0px black,
        1px -1px 0px black;
    opacity: 1;
}

.tag.indicator::after {
    position: absolute;
    top: calc(var(--mainFontSize) * -0.5);
    right: -2px;
    content: "\25CF";
    font-size: calc(var(--mainFontSize) * 1);
    color: var(--SmartThemeBodyColor);
    line-height: calc(var(--mainFontSize) * 1.3);
    text-align: center;
    text-shadow: 1px 1px 0px black,
        -1px -1px 0px black,
        -1px 1px 0px black,
        1px -1px 0px black;
    opacity: 1;
}

.rm_tag_bogus_drilldown {
    height: calc(var(--mainFontSize)* 2 - 2);
}

.rm_tag_bogus_drilldown .tag:not(:first-child) {
    position: relative;
    margin-left: 1em;
}

.rm_tag_bogus_drilldown .tag:not(:first-child)::before {
    font-family: 'Font Awesome 6 Free';
    content: "\f054";
    position: absolute;
    left: -1em;
    top: auto;
    color: var(--SmartThemeBodyColor);
    text-shadow: 1px 1px 0px black,
        -1px -1px 0px black,
        -1px 1px 0px black,
        1px -1px 0px black;
    opacity: 1;
}

.bogus_folder_select_back .avatar {

    min-height: calc(var(--mainFontSize)*2);

/* ===== css/backgrounds.css ===== */
/* Main Page Backgrounds */
#bg1 {
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-size: cover;
    position: absolute;
    width: 100%;
    height: 100%;
    transition: background-image var(--animation-duration-3x) ease-in-out;
    z-index: -1;
}

/* Fitting options */
#background_fitting {
    max-width: 8em;
}

/* Fill/Cover - scales to fill width while maintaining aspect ratio */
#bg1.cover {
    background-size: cover;
    background-position: center;
}

/* Fit/Contain - shows entire image maintaining aspect ratio */
#bg1.contain {
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
}

/* Stretch - stretches to fill entire space */
#bg1.stretch {
    background-size: 100% 100%;
}

/* Center - centers without scaling */
#bg1.center {
    background-size: auto;
    background-position: center;
    background-repeat: no-repeat;
}

/* This is the main flex container for the entire drawer */
.drawer-content.openDrawer.bg-drawer-layout {
    display: flex;
}

.bg-drawer-layout {
    flex-direction: column;
    padding: 0;
}

#bg-header-fixed {
    flex-shrink: 0;
    padding: 5px;
    background-color: var(--SmartThemeBlurTintColor);
    border-bottom: 1px solid var(--SmartThemeBorderColor);
    width: 100%;
}

.bg-header-row-1,
.bg-header-row-2 {
    display: flex;
    gap: 5px;
    width: 100%;
    align-items: baseline;
}

/* Control buttons in header */
.heading-container-with-controls {
    position: relative;
}

.heading-container-with-controls .heading-text {
    margin: 10px 0;
}

.heading-container-with-controls .heading-controls {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    gap: 5px;
}

#bg_menu_content,
#bg_custom_content {
    display: grid;
    gap: 5px;
    width: 100%;
    grid-template-columns: repeat(var(--bg-thumb-columns, 5), 1fr);
}

#bg-filter {
    font-size: calc(var(--mainFontSize) * 0.95);
}

#bg-sort {
    width: auto;
    max-width: 6em;
    flex-shrink: 0;
}

/* Thumbnails */
.bg_example:hover .BGSampleTitle {
    opacity: 1;
}

.bg_example .mobile-only-menu-toggle,
.bg_folder_tile .mobile-only-menu-toggle {
    display: none;
}

.bg_example {
    cursor: pointer;
    box-shadow: 0 0 7px var(--black50a);
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    border: 0px solid transparent;
    outline: 2px solid var(--SmartThemeBorderColor);
    outline-offset: -1px;

    height: auto;
    aspect-ratio: 16 / 9;
}

.bg_example:focus-visible {
    outline-offset: inherit;
    outline-color: var(--interactable-outline-color);
}

.bg_example.locked-background {
    outline: 2px solid var(--golden);
    outline-offset: 0;
}

.bg_example.locked-background::after,
.bg_example.selected-background::before,
#Backgrounds.bg-selection-mode #bg_menu_content .bg_example.folder-group-selected::before {
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    position: absolute;
    z-index: 4;
    filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.8));
    pointer-events: none;
}

.bg_example.selected-background::before,
#Backgrounds.bg-selection-mode #bg_menu_content .bg_example.folder-group-selected::before {
    content: '\f00c';
    top: 5px;
    color: var(--white100);
    font-size: calc(var(--mainFontSize) * 0.9);
}

.bg_example.locked-background::after {
    content: '\f023';
    bottom: 5px;
    right: 5px;
    color: var(--golden);
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));
    font-size: calc(var(--mainFontSize) * 0.8);

/* ===== css/streaming-display.css ===== */
/* ─────────────────────────────────────────────────────────────────────────────
   Streaming Display — floating toast panel for live LLM generation output.
   Shows reasoning (thinking) and content as they stream in.
   Used by extensions that leverage ConnectionManagerRequestService streaming.
   ───────────────────────────────────────────────────────────────────────────── */

.streaming-display {
    position: fixed;
    bottom: max(calc(var(--bottomFormBlockSize) + 5px), 20px);
    right: 20px;
    width: min(550px, calc(100vw - 40px));
    max-height: 70vh;
    background: var(--SmartThemeBlurTintColor);
    border: 1px solid var(--SmartThemeBorderColor);
    border-radius: 10px;
    padding: 14px;
    z-index: 9000;
    display: flex;
    flex-direction: column;
    gap: 10px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity var(--animation-duration, 125ms) ease, transform var(--animation-duration, 125ms) ease;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(12px);
}

.streaming-display-visible {
    opacity: 1;
    transform: translateY(0);
}

/* Header label with animated activity indicator */
.streaming-display-label {
    font-weight: 600;
    font-size: 0.95em;
    color: var(--SmartThemeBodyColor);
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
}

/* LED status indicator - pulsing while streaming */
.streaming-display-led {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgb(225, 138, 36);
    animation: streaming-display-pulse 1.5s ease-in-out infinite;
    flex-shrink: 0;
}

/* Completed state: solid green LED */
.streaming-display-complete .streaming-display-led {
    background: #4caf50;
    animation: none;
    opacity: 1;
    box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
}

/* Stopped state: solid red LED */
.streaming-display-stopped .streaming-display-led {
    background: #f44336;
    animation: none;
    opacity: 1;
    box-shadow: 0 0 8px rgba(244, 67, 54, 0.6);
}

@keyframes streaming-display-pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.1); }
}

/* Label text takes available space */
.streaming-display-label-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* Window control buttons container */
.streaming-display-controls {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-left: auto;
    flex-shrink: 0;
}

/* Window control buttons */
.streaming-display-btn {
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--SmartThemeBodyColor);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.6;
    transition: opacity 0.15s ease, background-color 0.15s ease;
}

.streaming-display-btn:hover {
    opacity: 1;
    background-color: rgba(255, 255, 255, 0.1);
}

.streaming-display-btn-close:hover {
    background-color: rgba(244, 67, 54, 0.2);
}

.streaming-display-btn-stop {
    font-size: 10px;
}

.streaming-display-btn-stop:hover {
    background-color: rgba(244, 150, 36, 0.2);
    color: rgb(225, 138, 36);
}

/* Content container - collapsible for minimize */
.streaming-display-content {
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow: hidden;
    transition: max-height var(--animation-duration, 125ms) ease, opacity var(--animation-duration, 125ms) ease;
}

/* Minimized state - hide content sections */
.streaming-display-minimized .streaming-display-content {
    max-height: 0;
    opacity: 0;
}

.streaming-display-minimized {
    gap: 0;
}

/* Model/API icon in the label */
.streaming-display-icon {
    width: 1.1em;
    height: 1.1em;
    flex-shrink: 0;
}

/* Minimized state adjustments */
.streaming-display-minimized.streaming-display {
    padding: 10px 14px;
}

/* Reasoning (thinking) section */
.streaming-display-reasoning {
    background: color-mix(in srgb, var(--SmartThemeBodyColor) 5%, transparent);
    border-radius: 6px;
    padding: 8px 10px;
    border-left: 3px solid color-mix(in srgb, var(--SmartThemeBodyColor) 25%, transparent);
}

.streaming-display-reasoning-label {
    font-size: 0.8em;
    font-weight: 600;
    opacity: 0.5;
    margin-bottom: 4px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
}

.streaming-display-reasoning-content {
    font-size: 0.82em;
    opacity: 0.65;
    max-height: 25vh;
    overflow-y: auto;
    word-break: break-word;
    line-height: 1.45;
    scrollbar-width: thin;
}

.streaming-display-reasoning-content p {
    margin: 0.3em 0;
}

.streaming-display-reasoning-content p:first-child {
    margin-top: 0;
}

.streaming-display-reasoning-content p:last-child {
    margin-bottom: 0;
}

/* Main content section */
.streaming-display-text {
    border-top: 1px solid color-mix(in srgb, var(--SmartThemeBorderColor) 50%, transparent);
    padding-top: 8px;
    min-height: 1.5em;
}

.streaming-display-text-content {
    font-size: 0.9em;
    color: var(--SmartThemeBodyColor);
    max-height: 40vh;
    overflow-y: auto;
    word-break: break-word;
    line-height: 1.5;
    scrollbar-width: thin;
}

.streaming-display-text-content p {
    margin: 0.4em 0;
}

.streaming-display-text-content p:first-child {
    margin-top: 0;
}

.streaming-display-text-content p:last-child {
    margin-bottom: 0;
}

/* Strip auto-added quotes from <q> tags, as message formatting adds them */
.streaming-display-reasoning-content q:before,
.streaming-display-reasoning-content q:after,
.streaming-display-text-content q:before,
.streaming-display-text-content q:after {
    content: '';
}


:root {
    interpolate-size: allow-keywords;
    --doc-height: 100%;
    --transparent: rgba(0, 0, 0, 0);

    --black30a: rgba(0, 0, 0, 0.3);
    --black50a: rgba(0, 0, 0, 0.5);
    --black60a: rgba(0, 0, 0, 0.6);
    --black70a: rgba(0, 0, 0, 0.7);
    --black90a: rgba(0, 0, 0, 0.9);
    --black100: rgba(0, 0, 0, 1);

    --white20a: rgba(255, 255, 255, 0.2);
    --white30a: rgba(255, 255, 255, 0.3);
    --white50a: rgba(255, 255, 255, 0.5);
    --white60a: rgba(255, 255, 255, 0.6);
    --white70a: rgba(255, 255, 255, 0.7);
    --white100: rgba(255, 255, 255, 1);

    --grey10: rgb(25, 25, 25);
    --grey30: rgb(75, 75, 75);
    --grey50: rgb(125, 125, 125);
    --grey5020a: rgba(125, 125, 125, 0.2);
    --grey5050a: rgba(125, 125, 125, 0.5);
    --grey70: rgb(175, 175, 175);
    --grey75: rgb(190, 190, 190);

    --grey30a: rgba(50, 50, 50, 0.3);
    --grey7070a: rgba(175, 175, 175, 0.7);

    --fullred: rgba(255, 0, 0, 1);
    --crimson70a: rgba(100, 0, 0, 0.7);
    --crimson-hover: rgba(150, 50, 50, 0.5);
    --okGreen70a: rgba(0, 100, 0, 0.7);
    --cobalt30a: rgba(100, 100, 255, 0.3);
    --greyCAIbg: rgb(36, 36, 37);
    --ivory: rgb(220, 220, 210);
    --golden: rgb(248, 211, 0);
    --warning: rgba(255, 0, 0, 0.9);
    --active: rgb(88, 182, 0);
    --preferred: rgb(244, 67, 54);

    --interactable-outline-color: var(--white100);
    --interactable-outline-color-faint: var(--white20a);

    --reasoning-body-color: var(--SmartThemeEmColor);
    --reasoning-em-color: color-mix(in srgb, var(--SmartThemeEmColor) 67%, var(--SmartThemeBlurTintColor) 33%);
    --reasoning-saturation: 0.5;


    /*Default Theme, will be changed by ToolCool Color Picker*/
    --SmartThemeBodyColor: rgb(220, 220, 210);
    --SmartThemeEmColor: rgb(145, 145, 145);
    --SmartThemeUnderlineColor: rgb(188, 231, 207);
    --SmartThemeQuoteColor: rgb(225, 138, 36);
    /* --SmartThemeFastUIBGColor: rgba(0, 0, 0, 0.9); */
    --SmartThemeBlurTintColor: rgba(23, 23, 23, 1);
    --SmartThemeChatTintColor: rgba(23, 23, 23, 1);
    --SmartThemeUserMesBlurTintColor: rgba(0, 0, 0, 0.3);
    --SmartThemeBotMesBlurTintColor: rgba(60, 60, 60, 0.3);
    --SmartThemeBlurStrength: calc(var(--blurStrength) * 1px);
    --SmartThemeShadowColor: rgba(0, 0, 0, 0.5);
    --SmartThemeBorderColor: rgba(0, 0, 0, 0.5);
    --SmartThemeCheckboxBgColorR: 220;
    --SmartThemeCheckboxBgColorG: 220;
    --SmartThemeCheckboxBgColorB: 210;
    --SmartThemeCheckboxTickColorValue: calc(((((var(--SmartThemeCheckboxBgColorR) * 299) + (var(--SmartThemeCheckboxBgColorG) * 587) + (var(--SmartThemeCheckboxBgColorB) * 114)) / 1000) - 128) * -1000);
    --SmartThemeCheckboxTickColor: rgb(var(--SmartThemeCheckboxTickColorValue),
            var(--SmartThemeCheckboxTickColorValue),
            var(--SmartThemeCheckboxTickColorValue));


    --sheldWidth: 50vw;
    /* 800px; */
    /*base variable calculated in rems*/
    --fontScale: 1;
    --mainFontSize: calc(var(--fontScale) * 15px);
    --mainFontFamily: "Noto Sans", sans-serif;
    --monoFontFamily: 'Noto Sans Mono', 'Courier New', Consolas, monospace;

    /* base variable for blur strength slider calculations */
    --blurStrength: 10;

    /* base variable for shadow width slider calculations */
    --shadowWidth: 2;

    /* Send form variables */
    --bottomFormBlockPadding: calc(var(--mainFontSize) / 2.5);
    --bottomFormIconSize: calc(var(--mainFontSize) * 1.9);
    --bottomFormBlockSize: calc(var(--bottomFormIconSize) + var(--bottomFormBlockPadding));

    /*Top Bar Scaling Variables*/
    --topBarIconSize: calc(var(--mainFontSize) * 2);
    --topBarBlockSize: calc(var(--topBarIconSize) + var(--topBarBlockPadding));
    --topBarBlockPadding: calc(var(--mainFontSize) / 3);

    /*styles for the color picker*/
    --tool-cool-color-picker-btn-bg: transparent;
    --tool-cool-color-picker-btn-border-color: transparent;

    --mes-right-spacing: 30px;

    --avatar-base-height: 50px;
    --avatar-base-width: 50px;
    --avatar-base-border-radius: 2px;
    --avatar-base-border-radius-round: 50%;
    --avatar-base-border-radius-rounded: 10px;
    --inline-avatar-small-factor: 0.6;

    --animation-duration: 125ms;
    --animation-duration-2x: calc(var(--animation-duration) * 2);
    --animation-duration-3x: calc(var(--animation-duration) * 3);
    --animation-duration-slow: var(--animation-duration-3x);
}

* {
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    -moz-osx-font-smoothing: grayscale;
    text-shadow: 0px 0px calc(var(--shadowWidth) * 1px) var(--SmartThemeShadowColor);
}

html {
    /*fix for chrome flickering on blurred divs*/
    -webkit-transform: translateZ(0);
    -webkit-backface-visibility: hidden;
    -webkit-perspective: 1000;
}

body {
    margin: 0;
    padding: 0;
    width: 100%;
    /*fallback for JS load*/
    height: 100vh;
    height: 100dvh;
    /*defaults as 100%, then reassigned via JS as pixels, will work on PC and Android*/
    /*height: calc(var(--doc-height) - 1px);*/
    background-color: var(--SmartThemeBlurTintColor);
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-size: cover;
    font-family: var(--mainFontFamily);
    font-size: var(--mainFontSize);
    color: var(--SmartThemeBodyColor);
    overflow: hidden;
    color-scheme: only light;
}

::-webkit-scrollbar {
    width: 0.7rem;
    scrollbar-gutter: stable;
}

::-webkit-scrollbar-track {
    cursor: default;
}

::-webkit-scrollbar-track:hover {
    /* Adaptive, but won't contrast with neutral-gray. */
    background-color: rgba(126, 126, 126, 0.2);
}

::-webkit-scrollbar-thumb {
    cursor: grab;
}

::-webkit-scrollbar-thumb:active {
    cursor: grabbing;
}

.scrollY {
    overflow-y: auto !important;
}

::-webkit-scrollbar-thumb:vertical {
    background-color: var(--grey7070a);
    box-shadow: inset 0 0 0 1px var(--black50a);
    border-radius: 10px;
    background-clip: content-box;
    border: 2px solid transparent;
    min-height: 40px;
}

body.movingUI ::-webkit-scrollbar-thumb:vertical {
    border-top: 20px solid transparent;
}

::-webkit-scrollbar-thumb:horizontal {
    background-color: var(--grey7070a);
    box-shadow: inset 0 0 0 1px var(--black50a);
    border-radius: 10px;
    background-clip: content-box;
    border: 2px solid transparent;
    min-width: 40px;
}

::-webkit-scrollbar-corner {
    background-color: transparent;
}

table.responsiveTable {
    width: 100%;
    margin: 10px 0;
}

.responsiveTable tr {
    display: flex;
}

.responsiveTable,
.responsiveTable th,
.responsiveTable td {
    flex: 1;
    border: 1px solid;
    border-collapse: collapse;
    word-break: break-all;
    padding: 5px;
}

.hidden,
.hiddenByScroll {
    visibility: hidden !important;
}

.animated {
    -webkit-animation-duration: var(--animation-duration, 3s) !important;
    animation-duration: var(--animation-duration, 3s) !important;
    -webkit-animation-fill-mode: both !important;
    animation-fill-mode: both !important;
    box-shadow: inset 0 0 5px var(--SmartThemeQuoteColor);
}

.flash {
    animation-name: flash;
}

.has_hover_label .label_icon {
    transition: opacity var(--animation-duration) ease, max-width var(--animation-duration) ease;
}

.has_hover_label .label {
    transition: opacity var(--animation-duration-slow) ease, max-width var(--animation-duration-slow) ease;
    /* Prevent double gap on hidden icon */
    margin-left: -5px;
}

.has_hover_label .label_icon,
.has_hover_label .label {
    transition-delay: var(--animation-duration-slow);
}

.has_hover_label.fast .label_icon,
.has_hover_label.fast .label {
    transition-delay: var(--animation-duration);
}

.has_hover_label .label_icon,
.has_hover_label:hover .label {
    opacity: 1;
    max-width: 100px;
}

.has_hover_label:hover .label_icon,
.has_hover_label .label {
    opacity: 0;
    max-width: 0;
    overflow: hidden;
}

/* Keyboard/focus navigation styling */
/* Mimic the outline of keyboard navigation for most most focusable controls */
.interactable {
    border-radius: 5px;
}

/* Outline for "normal" buttons should only be when actual keyboard navigation is used */
.interactable:focus-visible {
    outline: 1px solid var(--interactable-outline-color);
}

/* Prevent the outline from being cut off by hiding the overflow */
.tag.interactable:focus-visible {
    outline-offset: -1px;
}

/* The specific input controls can always have a faint outline, even on mouse interaction, to give a better hint */
select:focus-visible,
input:focus-visible,
textarea:focus-visible {
    outline: 1px solid var(--interactable-outline-color-faint);
}

input[type='checkbox']:focus-visible {
    outline: 1px solid var(--interactable-outline-color);
}

/* General dragover styling */
.dragover {
    filter: brightness(1.1) saturate(1.0);
    outline: 3px dashed var(--SmartThemeBorderColor);
    animation: pulse var(--animation-duration-3x) infinite alternate;
}

.dragover.no_animation {

}

#top-bar {

    height: var(--bottomFormBlockSize);
    position: absolute;
    /* border-bottom: 1px solid var(--SmartThemeBorderColor); */
    box-shadow: 0 2px 20px 0 var(--black70a);
    backdrop-filter: blur(var(--SmartThemeBlurStrength));
    background-color: var(--SmartThemeBlurTintColor);
    -webkit-backdrop-filter: blur(var(--SmartThemeBlurStrength));
    z-index: 3005;
}

#sheld {
    display: flex;
    flex-direction: column;
    /* -1px to give sheld some wiggle room to bounce off tobar when moving*/
    height: calc(100vh - var(--topBarBlockSize) - 1px);
    height: calc(100dvh - var(--topBarBlockSize) - 1px);
    max-height: calc(100dvh - var(--topBarBlockSize) - 1px);
    overflow-x: hidden;
    /* max-width: 50vw; */
    position: absolute;
    left: calc((100vw - var(--sheldWidth))/2);
    left: calc((100dvw - var(--sheldWidth))/2);
    top: var(--topBarBlockSize);
    margin: 0 auto;
    left: 0;
    right: 0;
    z-index: 30;
    min-height: 100px;
    min-width: 100px;
    width: var(--sheldWidth);
}

.drag-grabber {
    position: absolute;
    /*     width: 20px !important;
    height: 20px !important; */
    margin: 0px 5px;
    color: var(--SmartThemeBodyColor);
    z-index: 2000;
    text-align: center;

    right: 0px;
    top: 0px;
    opacity: 0.5;
    cursor: grab;
    /* border: 1px solid var(--SmartThemeBorderColor); */
    cursor: -moz-grab;
    cursor: -webkit-grab;
    display: none;
    filter: drop-shadow(0px 0px 0px black);
    transition: all var(--animation-duration-2x);
    font-size: calc(var(--mainFontSize)*1.3);

/* SWIPE RELATED STYLES*/

.mes {
    --swipeCounterHeight: 15px;
    --swipeCounterMargin: 5px;
}

/* https://stackoverflow.com/a/31819499 */
/* This has much better performance than .transform on large chats*/
.slide {
    animation: slide calc(var(--slide-mes-x-duration, var(--animation-duration, 125ms))) ease-in-out forwards;
    -webkit-animation: slide calc(var(--slide-mes-x-duration, var(--animation-duration, 125ms))) ease-in-out forwards;
    will-change: transform;
}

.swipe_right,
.swipe_left {
    width: 25px;
    height: 25px;
    opacity: 0.3;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    grid-row-start: 2;
    font-size: 20px;
    cursor: pointer;
    align-self: center;
    pointer-events: auto;
}

.swipe_left {
    position: absolute;
    bottom: calc(var(--swipeCounterHeight) + var(--swipeCounterMargin));
    flex-flow: column;
}

.swipeRightBlock {
    position: absolute;
    right: 0;
    bottom: 0;
    pointer-events: none;
}

.swipes-counter {
    opacity: 0.3;
    color: var(--SmartThemeBodyColor);
    font-size: 12px;
    padding: 0 5px;
    font-family: var(--mainFontFamily);
    font-weight: 400;
    align-self: center;
    min-width: 40px;
    display: flex;
    justify-content: center;
    margin-bottom: var(--swipeCounterMargin);
    height: var(--swipeCounterHeight);
    pointer-events: auto;
}

.swipes-counter.swipe-picker-enabled {
    cursor: pointer;
}

.swipes-counter.swipe-picker-enabled:hover,
.swipes-counter.swipe-picker-enabled:focus-visible {
    opacity: 0.7;
}

.swipe_picker_header {
    position: sticky;
    top: 0;
    z-index: 1;
}

.swipe_picker_popup .popup-body,
.swipe_picker_popup .popup-content {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
}


body.swipeAllMessages .mes:not(.last_mes) .swipes-counter {
    /* Avoid expensive DOM queries */
    opacity: 0.3;
    display: flex;
}

.swipe_left {
    right: auto;
    left: 20px;
}

.swipe_right {
    right: 5px;
    align-self: center;
    display: flex;
}

/* The last swipe must be highlighted */
.last_swipe :is(.swipes-counter, .swipe_right) {
    opacity: 0.7;
    /* Doubled opacity needs a longer transition to match a non active arrow. */
    /* (Duration * Active Opacity / Inactive Opacity * 2) */
    transition-duration: calc(var(--animation-duration-2x) * 0.7/0.3);
}

.fade :is(.swipes-counter, .swipe_left, .swipe_right){
    /* Fade in and out: */
    /* https://nerdy.dev/using-starting-style-and-transition-behavior-for-enter-and-exit-stage-effects */
    /* https://developer.mozilla.org/en-US/docs/Web/CSS/transition-behavior#description */
    transition: opacity calc(var(--animation-duration) * 2) ease-in;

    /* Fade in. */
    @supports (transition-behavior: allow-discrete) {
        transition:
            opacity var(--animation-duration-2x) ease-in,
            display var(--animation-duration-2x) ease-in,
            visibility var(--animation-duration-2x) ease-in;
        transition-behavior: allow-discrete;
    }
}

/* Hide all but the last message. */
body:not(.swipeAllMessages) .mes:not(.last_mes) :is(.swipe_left, .swipe_right, .swipes-counter),
/* Hide non-visible swipe_left. */
.mes:not(.swipes_visible) .swipe_left,
/* Only hide swipe_right if it's not visible, and not the last swipe. */
.mes:not(.swipes_visible, .last_swipe) :is(.swipe_right),
/* Hide all swipe buttons if .hideAllSwipeButtons. */
body.hideAllSwipeButtons :is(.swipe_left, .swipe_right),
.swipes-counter[hidden],
.swipe_right[hidden],
.swipe_left[hidden] {
    /* Fade out */
    opacity: 0 !important;
    /* With display:none, the swipes-counter div wil collapse, shifting the chevron. */
    visibility: hidden;
    /* Interactivity has limited availability https://caniuse.com/?search=interactivity */
    interactivity: inert;
    pointer-events: none;
}

            var(--prog) calc(var(--progDone) * var(--progWidthClip)),
            var(--prog) var(--progWidthClip),
            100% var(--progWidthClip),

.autoComplete-wrap {
    --targetOffset: 0;
    --direction: column;
    --leftOffset: 1vw;
    --rightOffset: 1vw;
    display: flex;
    flex-direction: var(--direction);
    position: absolute;
    left: var(--leftOffset);
    right: var(--rightOffset);
    z-index: 10000;
    pointer-events: none;

    .autoComplete {
        pointer-events: all;
    }


    &.isFloating {
        --direction: row;
        left: 0;
        right: 0;

        &:before {
            content: "";
            flex: 0 1 calc(var(--targetOffset) * 1px);
            display: block;
            pointer-events: none;
        }

        .autoComplete {
            flex: 0 0 auto;
            width: 50vw;
        }

        /* Small style variant for macro autocomplete (33vw, max 700px) */
        &[data-macros-autocomplete-style="small"] .autoComplete {
            width: 33vw;
            max-width: 700px;
            min-width: 250px;
        }

        &:after {
            content: "";
            flex: 1 1 0;
            display: block;
            pointer-events: none;
        }
    }
}

.autoComplete-detailsWrap {
    --targetOffset: 0;
    --rightOffset: 1vw;
    --bottomOffset: 0;
    --leftOffset: 74vw;
    display: flex;
    flex-direction: column;
    position: absolute;
    top: 5vh;
    right: var(--rightOffset);
    bottom: var(--bottomOffset);
    left: var(--leftOffset);
    z-index: 10000;
    pointer-events: none;

    &:before {
        content: "";
        flex: 0 1 calc(var(--targetOffset) * 1px - 5vh);
        display: block;
    }

    .autoComplete-details {
        flex: 0 0 auto;
        max-height: 80vh;
        pointer-events: all;
    }

    &:after {
        content: "";
        flex: 1 1 0;
        display: block;
    }

    &.isFloating {
        flex-direction: row;
        left: 0;
        right: 0;

        .autoComplete-details {
            max-height: unset;
            width: 25vw;
        }

        /* Small style variant for macro autocomplete (33vw, max 700px) */
        &[data-macros-autocomplete-style="small"] .autoComplete-details {
            width: 33vw;
            max-width: 700px;
            min-width: 250px;
        }

        &[data-macros-autocomplete-style="small"] {
            &.left {
                &:before {
                    flex: 0 1 calc(var(--targetOffset) * 1px - 33vw);
                }

                &:after {
                    flex: 1 0 auto;
                    max-width: 33vw;
                }
            }

            &.right {
                &:before {
                    flex: 0 0 calc(var(--targetOffset) * 1px + 33vw);
                }
            }

            &.full {
                .autoComplete-details {
                    max-width: 33vw;
                }
            }
        }

        &.left {
            &:before {
                flex: 0 1 calc(var(--targetOffset) * 1px - 25vw);
            }

            &:after {
                flex: 1 0 auto;
                max-width: 50vw;
            }
        }

        &.right {
            &:before {
                flex: 0 0 calc(var(--targetOffset) * 1px + 50vw);
            }
        }

        &.full {
            &:before {
                content: "";
                flex: 0 1 calc(var(--targetOffset) * 1px);
                display: block;
            }

            .autoComplete-details {
                flex: 0 0 auto;
                max-width: 50vw;
                width: unset;
            }

            &:after {
                content: "";
                flex: 1 1 0;
                display: block;
            }
        }
    }
}

    --ac-color-variable: var(--ac-style-color-variable, rgba(131 193 252 / 1));
    --ac-color-variableLanguage: var(--ac-style-color-variableLanguage, rgba(98 160 251 / 1));
    --ac-color-punctuation: var(--ac-style-color-punctuation, rgba(242 214 48 / 1));
    --ac-color-punctuationL1: var(--ac-style-color-punctuationL1, rgba(195 118 210 / 1));
    --ac-color-punctuationL2: var(--ac-style-color-punctuationL2, rgba(98 160 251 / 1));
    --ac-color-currentParenthesis: var(--ac-style-color-currentParenthesis, rgba(195 118 210 / 1));
    --ac-color-comment: var(--ac-style-color-comment, rgba(122 151 90 / 1));
    --ac-color-keyword: var(--ac-style-color-keyword, rgba(182 137 190 / 1));

    font-size: calc(var(--ac-font-scale) * 1em);

    --bottom: 50vh;
    background: var(--ac-color-background);
    backdrop-filter: blur(var(--SmartThemeBlurStrength));
    border: 1px solid var(--ac-color-border);
    border-radius: 3px;
    color: var(--ac-color-text);
    max-height: calc(95vh - var(--bottom));
    list-style: none;
    margin: 0px;
    overflow: auto;
    padding: 0px;
    padding-bottom: 1px;
    line-height: 1.2;
    text-align: left;
    z-index: 10000;

    * {
        text-shadow: none;
    }
}

body[data-stscript-style] .autoComplete [data-option-type] {
    &[data-option-type="enum"] .type {
        color: var(--ac-color-string);
    }

    &[data-option-type="command"] .type {

    }

    &[data-option-type="namedArgument"] .type {
        color: var(--ac-color-argName);
    }

    &[data-option-type="variable"] .type {
        color: var(--ac-color-punctuationL1);
    }

    &[data-option-type="qr"] .type {

    }

    &[data-option-type="macro"] .type {
        color: var(--ac-color-variableLanguage);
    }

    &[data-option-type="number"] .type {

body[data-stscript-style] .hljs.language-stscript {
    * {
        text-shadow: none !important;
    }

    text-shadow: none !important;

    background-color: var(--ac-style-color-background);
    color: var(--ac-style-color-text);

    .hljs-title.function_ {
        color: var(--ac-style-color-cmd);
    }

    .hljs-title.function_.invoke__ {
        color: var(--ac-style-color-cmd);
    }

    .hljs-string {
        color: var(--ac-style-color-string);
    }

    .hljs-number {
        color: var(--ac-style-color-number);
    }

    .hljs-variable {
        color: var(--ac-style-color-variable);
    }

    .hljs-variable.language_ {
        color: var(--ac-style-color-variableLanguage);
    }

    .hljs-property {
        color: var(--ac-style-color-argName);
    }

    .hljs-punctuation {
        color: var(--ac-style-color-punctuation);
    }

    .hljs-comment {
        color: var(--ac-style-color-comment);
    }

    .hljs-abort {
        color: var(--ac-style-color-abort, #e38e23);
        font-weight: bold;
    }

    .hljs-keyword {
        color: var(--ac-style-color-keyword);
        font-weight: bold;
    }

    .hljs-pipe {
        color: var(--ac-style-color-punctuation);
    }

    .hljs-pipebreak {
        color: var(--ac-style-color-type);
    }

    .hljs-closure {
        >.hljs-punctuation {
            color: var(--ac-style-color-punctuation);
        }

        .hljs-closure {
            >.hljs-punctuation {
                color: var(--ac-style-color-punctuationL1);
            }

            .hljs-closure {
                >.hljs-punctuation {
                    color: var(--ac-style-color-punctuationL2);
                }

                .hljs-closure {
                    >.hljs-punctuation {
                        color: var(--ac-style-color-punctuation);
                    }

                    .hljs-closure {
                        >.hljs-punctuation {
                            color: var(--ac-style-color-punctuationL1);
                        }

                        .hljs-closure {
                            >.hljs-punctuation {
                                color: var(--ac-style-color-punctuationL2);
                            }
                        }
                    }
                }
            }
        }
    }
}

.autoComplete {
    padding-bottom: 1px;
    display: grid;
    grid-template-columns: 0fr auto minmax(50%, 1fr);
    align-items: center;
    max-height: calc(95vh - var(--bottom));
    container-type: inline-size;

    >.item {
        cursor: pointer;
        padding: 3px;
        text-shadow: none;
        display: flex;
        gap: 0.5em;
        display: contents;

        >.stopgap {
            opacity: 0.75;
            display: none;
        }

        @container (max-width: 80em) {
            .specs {
                grid-column: 2 / 4;
            }

            >.help {
                grid-column: 2 / 4;
                padding-left: 1em;
                opacity: 0.75;
                height: auto;
            }

            >.stopgap {
                display: inline-block;
            }
        }

        &.blank {
            display: block;
            grid-column: 1 / 4;
        }

        &:hover>* {
            background-color: var(--ac-color-hoveredBackground);
            color: var(--ac-color-hoveredText);
        }

        &.selected>* {
            background-color: var(--ac-color-selectedBackground);
            color: var(--ac-color-selectedText);
        }

        &.selected.not-selectable>* {
            background-color: var(--ac-color-notSelectableBackground);
            color: var(--ac-color-notSelectableText);
        }

        >* {
            height: 100%;
        }

        >*+* {
            padding-left: 0.5em;
        }

        >.type {
            flex: 0 0 auto;
            display: inline-flex;
            justify-content: center;
            width: 2.25em;
            font-size: 0.8em;
            text-align: center;
            /* opacity: 0.6; */
            white-space: nowrap;
            font-family: var(--monoFontFamily);
            line-height: calc(1.2em / 0.8);
            /* &:before { content: "["; }
            &:after { content: "]"; } */
        }

        >.specs {
            align-items: flex-start;

            >.name {
                >.matched {
                    background-color: var(--ac-color-matchedBackground);
                    color: var(--ac-color-matchedText);
                    font-weight: bold;
                }
            }

            >.body {
                flex-wrap: wrap;
                column-gap: 0.5em;

                >.arguments {
                    display: contents;
                    height: 100%;
                }
            }
        }

        >.help {
            height: 100%;

            >.helpContent {
                text-overflow: ellipsis;
                overflow: hidden;
                font-size: 0.9em;
                white-space: nowrap;
                line-height: 1.2;
                max-height: 1.2em;
                display: block;

                >* {
                    display: contents;
                }
            }
        }
    }
}

.autoComplete-details {
    display: flex;
    flex-direction: column;
    gap: 0.5em;

    >.specs {
        cursor: default;
        flex-direction: column;
        padding: 0.25em 0.25em 0.5em 0.25em;
        border-bottom: 1px solid var(--ac-color-border);

        >.head {
            display: flex;
            gap: 0.5em;
        }

        >.head>.name,
        >.name {
            flex: 1 1 auto;
            font-weight: bold;
            color: var(--ac-color-text);
            cursor: help;

            &:hover {
                text-decoration: 1px dotted underline;
            }
        }

        >.head>.rawQuotes {
            padding: 0 0.5em;
            cursor: help;

            &:hover {
                text-decoration: 1px dotted underline;
            }
        }

        >.head>.source {
            padding: 0 0.5em;
            cursor: help;
            display: flex;
            align-items: center;
            gap: 0.5em;

            &.isThirdParty.isExtension {
                color: #F89406;
            }

            &.isCore {
                color: transparent;

                &.isExtension {
                    color: #51A351;
                }

                &:after {
                    content: '';
                    order: -1;
                    height: 14px;
                    aspect-ratio: 1 / 1;
                    background-image: url('/favicon.ico');
                    background-size: contain;
                    background-repeat: no-repeat;
                }
            }

            &:hover {
                text-decoration: 1px dotted underline;
            }
        }

        >.body {
            flex-direction: column;
            gap: 0.5em;

            >.arguments {
                margin: 0;
                padding-left: 1.25em;

                >.argumentItem::marker {
                    color: color-mix(in srgb, var(--ac-color-text), var(--ac-style-color-background));
                }

                .argumentSpec {
                    display: flex;
                    gap: 0.5em;

                    .argument-default {
                        &:before {
                            content: " = ";
                            color: var(--ac-color-text);
                        }

                        color: var(--ac-color-string);
                    }
                }

                .argument {
                    cursor: help;

                    &:hover:not(:has(.argument-name:hover, .argument-types:hover, .argument-enums:hover)) {
                        text-decoration: 1px dotted underline;
                    }
                }

                .argument-name,
                .argument-types,
                .argument-enums,
                .argument-default {
                    cursor: help;

                    &:hover {
                        text-decoration: 1px dotted underline;
                    }
                }

                .argument.optional+.argument-description:before,
                .argumentSpec:has(.argument.optional)+.argument-description:before {
                    content: "(optional) ";
                    color: var(--ac-color-text);
                    opacity: 0.5;
                }

                .argument-description {
                    margin-left: 0.5em;
                    font-family: var(--mainFontFamily);
                    font-size: 0.9em;
                }
            }

            .returns {
                cursor: help;

                &:hover {
                    text-decoration: 1px dotted underline;
                }
            }
        }
    }

    >.help {
        padding: 0 0.5em 0.5em 0.5em;

        div {
            margin-block-end: 1em;
        }

        ul {
            margin: 0;
            padding-left: 1.5em;
        }

        pre {
            margin: 0;

            >code {
                display: block;
                padding: 1px;
                tab-size: 4;
            }
        }
    }

    >.aliases {
        padding: 0 0.5em 0.5em 0.5em;

        &:before {
            content: '(alias: ';
        }

        >.alias {
            font-family: var(--monoFontFamily);

            &+.alias:before {
                content: ', ';
            }
        }

        &:after {
            content: ')';
        }
    }
}

.autoComplete>.item,
.autoComplete-details {
    >.specs {
        display: flex;
        gap: 0.5em;

        >.name {
            font-family: var(--monoFontFamily);
            white-space: nowrap;
            /* color: var(--ac-color-text); */
        }

        >.body {
            display: flex;

            >.arguments {
                font-family: var(--monoFontFamily);

                .argument {
                    white-space: nowrap;

                    &.namedArgument {
                        &:before {
                            content: "[";
                            color: var(--ac-color-text);
                        }

                        &:after {
                            content: "]";
                            color: var(--ac-color-text);
                        }

                        &.optional:after {
                            content: "]?";
                            color: var(--ac-color-text);
                        }

                        >.argument-name {
                            color: var(--ac-color-argName);
                        }
                    }

                    &.unnamedArgument {
                        &:before {
                            content: "(";
                            color: var(--ac-color-text);
                        }

                        &.multiple:before {
                            content: "...(";
                            color: var(--ac-color-text);
                        }

                        &:after {
                            content: ")";
                            color: var(--ac-color-text);
                        }

                        &.optional:after {
                            content: ")?";
                            color: var(--ac-color-text);
                        }
                    }

                    >.argument-name+.argument-types:before {
                        content: "=";
                        color: var(--ac-color-text);
                    }

                    >.argument-types {
                        color: var(--ac-color-type);
                        word-break: break-all;
                        white-space: break-spaces;

                        >.argument-type+.argument-type:before {
                            content: "|";
                            color: var(--ac-color-text);
                        }

                        ;
                    }

                    >.argument-types+.argument-enums,
                    >.argument-name+.argument-enums {
                        &:before {
                            content: "=";
                            color: var(--ac-color-text);
                        }
                    }

                    >.argument-enums {
                        color: var(--ac-color-string);
                        word-break: break-all;
                        white-space: break-spaces;

                        >.argument-enum+.argument-enum:before {
                            content: "|";
                            color: var(--ac-color-text);
                        }

                        ;
                    }
                }
            }

            >.returns {
                font-family: var(--monoFontFamily);
                color: var(--ac-color-text);

                &:before {
                    content: "=> ";
                    color: var(--ac-color-symbol);
                }
            }
        }
    }
}

.doubleRangeContainer {
    display: flex;
    --markerWidth: 15px;
    container-type: inline-size;
    container-name: doubleRangeContainer;

    >.doubleRangeInputContainer {
        flex: 0 0 50%;
        overflow: hidden;
        position: relative;

        >datalist {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            font-size: x-small;

            >option {
                flex: 0 0 0;
                width: 0;
                display: flex;
                justify-content: center;
            }
        }

        @container doubleRangeContainer (max-width: 200px) {
            >datalist {
                height: 2.5em;
            }

            &:nth-child(1)>datalist>option {
                transform: rotate(-45deg);
                transform-origin: bottom right;
            }

            &:nth-child(2)>datalist>option {
                transform: rotate(45deg);
                transform-origin: bottom left;
            }
        }

        >input::-webkit-slider-thumb {
            z-index: 2;
        }

        &:after {
            /* shifted to center to hide corners of the inset shadow */
            --shift: 2px;
            /* 100% of the input width (1em padding) */
            --inputWidth: calc(100% - 1em);
            /* input padding max(20px, 20%) */
            --inputPadding: calc(max(20px, var(--inputWidth) * 0.2));
            /* 100% of the variable range width: 100% of input - input padding - marker width) */
            --rangeWidth: calc(var(--inputWidth) - var(--inputPadding) - var(--markerWidth));
            /* always visible part of the input range (value = 0) */
            --zeroOffset: calc(var(--inputPadding) + var(--markerWidth) / 2);
            content: '';
            position: absolute;
            top: 11px;
            width: calc(var(--value) / 2 * var(--rangeWidth) + var(--zeroOffset) + var(--shift));
            height: 5px;
            background-color: var(--SmartThemeQuoteColor);
            box-shadow: inset 0 0 2px black;
        }

        &:nth-child(1) {
            --value: 0;
            padding-left: 1em;

            >input {
                direction: rtl;
                position: relative;
                padding-right: max(20px, 20%);
            }

            >datalist {
                direction: rtl;
                padding-right: calc(var(--markerWidth)/2 + max(20px, 20%));
                padding-left: calc(var(--markerWidth)/2 - 2px);
            }

            &:after {
                right: -2px;
            }
        }

        &:nth-child(2) {
            --value: 0;
            padding-right: 1em;

            >input {
                position: relative;
                padding-left: max(20px, 20%);
            }

            >datalist {
                padding-left: calc(var(--markerWidth)/2 + max(20px, 20%));
                padding-right: calc(var(--markerWidth)/2 - 2px);
            }

            &:after {
                left: -2px;
            }
        }
    }
}

    <style>
/* ===== official/css/popup.css ===== */
@import url('/lib/dialog-polyfill.css');
@import url(official/css/popup-safari-fix.css);

dialog {
    color: var(--SmartThemeBodyColor);
}

/* Closed state of the dialog */
.popup {
    width: 500px;
    text-align: center;
    box-shadow: 0px 0px 14px var(--black70a);
    border: 1px solid var(--SmartThemeBorderColor);
    padding: 4px 14px;
    background-color: var(--SmartThemeBlurTintColor);
    border-radius: 10px;
    display: flex;
    flex-direction: column;

    max-height: calc(100dvh - 2em);
    max-width: calc(100dvw - 2em);
    min-height: fit-content;

    /* Overflow visible so elements (like toasts) can appear outside of the dialog. '.popup-body' is hiding overflow for the real content. */
    overflow: visible;

    /* Fix weird animation issue with font-scaling during popup open */
    backface-visibility: hidden;
    -webkit-font-smoothing: subpixel-antialiased;

    /* Variables setup */
    --popup-animation-speed: var(--animation-duration-slow);
}

/** Popup styles applied to the main popup */
.popup--animation-fast {
    --popup-animation-speed: var(--animation-duration);
}

.popup--animation-slow {
    --popup-animation-speed: var(--animation-duration-slow);
}

.popup--animation-none {
    --popup-animation-speed: 0ms;
}

/* Styling of main popup elements */
.popup .popup-body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    width: min(100%, 100vw);
    height: 100%;
    padding: 1px;
}

.popup:not(:has(.img_enlarged_container)) .popup-body {
    max-height: 95dvh;
}

.popup .popup-content {
    margin-top: 10px;
    padding: 0 8px;
    overflow: hidden;
    flex-grow: 1;
}

.popup .popup-content h3:first-child {
    /* No double spacing for the first heading needed, the .popup-content already has margin */
    margin-top: 0px;
}

.popup.vertical_scrolling_dialogue_popup .popup-content {
    overflow-y: auto;
}

.popup.horizontal_scrolling_dialogue_popup .popup-content {
    overflow-x: auto;
}

.popup.left_aligned_dialogue_popup .popup-content {
    text-align: start;
}

/* Opening animation */
.popup[opening] {
    animation: pop-in var(--popup-animation-speed) ease-in-out;
}

.popup[opening]::backdrop {
    animation: fade-in var(--popup-animation-speed) ease-in-out;
}

/* Fix toast container snapping into the backdrop while the animation is running */
.popup[opening] #toast-container {
    visibility: hidden;
}

/* Open state of the dialog */
.popup[open] {
    color: var(--SmartThemeBodyColor);
}

.popup[open]::backdrop {
    backdrop-filter: blur(calc(var(--SmartThemeBlurStrength) * 2));
    -webkit-backdrop-filter: blur(calc(var(--SmartThemeBlurStrength) * 2));
    background-color: var(--black30a);
}

body.no-blur .popup[open]::backdrop {
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
}

/* Closing animation */
.popup[closing] {
    animation: pop-out var(--popup-animation-speed) ease-in-out;
}

.popup[closing]::backdrop {
    animation: fade-out var(--popup-animation-speed) ease-in-out;
}

/* Edge inset to match Toastr default spacing */
:root {
    --toast-edge: 12px;
}

.popup #toast-container {
    /* Popups are centered by default; toasts should not be */
    text-align: left;
}

/* Per-position position adjustments caused by the top bar, inside the popup */
.popup #toast-container.toast-top-left {
    top: calc(var(--toast-edge) + var(--topBarBlockSize));
}

.popup #toast-container.toast-top-center {
    /* toastr in core does not have a top offset on center, so we don't do that either in popups */
    top: var(--topBarBlockSize);
}

.popup #toast-container.toast-top-right {
    top: calc(var(--toast-edge) + var(--topBarBlockSize));
}

.popup-crop-wrap {

    max-height: 75vh;
    max-height: 75dvh;

}

.popup-inputs {

.popup-inputs label span {

.popup-input {

.popup-controls {

.menu_button.menu_button_default {

}

.popup-controls .menu_button {
    /* Popup buttons should not scale to smallest size, otherwise they will always break to multiline if multiple words */
    width: unset;

    <script>
// ===== js/audio-player.js =====
// formatTime —— 官方 scripts/utils.js L975-983 原样内联（避免整包 utils.js 依赖链）
function formatTime(seconds) {
    if (!isFinite(seconds) || isNaN(seconds)) {
        return '0:00';
    }

    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${minutes}:${secs.toString().padStart(2, '0')}`;
}

class AudioPlayer {
    /**
     * Creates an audio player instance
     * @param {HTMLElement} audioElement - The audio element to control
     * @param {HTMLElement} containerElement - The container element with player controls
     * @param {Object} options - Configuration options
     */
    constructor(audioElement, containerElement, options = {}) {
        if (!(audioElement instanceof HTMLAudioElement)) {
            throw new Error('First argument must be an HTMLAudioElement');
        }
        if (!(containerElement instanceof HTMLElement)) {
            throw new Error('Second argument must be an HTMLElement');
        }

        this.audio = audioElement;
        this.container = containerElement;
        this.options = {
            title: '',
            autoplay: false,
            volume: 1.0,
            onPlay: null,
            onPause: null,
            onEnded: null,
            onTimeUpdate: null,
            onVolumeChange: null,
            ...options,
        };

        this.isDragging = false;
        this.isDestroyed = false;

        // Store bound event handlers for cleanup
        this.boundHandlers = {
            // Audio event handlers
            audioLoadedMetadata: this.onAudioLoadedMetadata.bind(this),
            audioTimeUpdate: this.onAudioTimeUpdate.bind(this),
            audioPlay: this.onAudioPlay.bind(this),
            audioPause: this.onAudioPause.bind(this),
            audioEnded: this.onAudioEnded.bind(this),
            audioVolumeChange: this.onAudioVolumeChange.bind(this),
            // Control event handlers
            playPauseClick: this.onPlayPauseClick.bind(this),
            volumeClick: this.onVolumeClick.bind(this),
            volumeInput: this.onVolumeInput.bind(this),
            progressMouseDown: this.onProgressMouseDown.bind(this),
            progressClick: this.onProgressClick.bind(this),
            progressMouseMove: this.onProgressMouseMove.bind(this),
            documentMouseMove: this.onDocumentMouseMove.bind(this),
            documentMouseUp: this.onDocumentMouseUp.bind(this),
        };

        // MutationObserver for DOM cleanup detection
        this.observer = null;

        this.init();
    }

    /**
     * Initializes the audio player by setting up elements, events, and initial state
     * @returns {void}
     */
    init() {
        this.findElements();
        this.bindEvents();
        this.setupDOMObserver();

        if (this.options.title) {
            this.setTitle(this.options.title);
        } else if (this.audio.title) {
            this.setTitle(this.audio.title);
        } else if (this.audio.src) {
            const srcParts = this.audio.src.split('/');
            this.setTitle(decodeURIComponent(srcParts[srcParts.length - 1]));
        }

        if (this.options.autoplay) {
            this.play();
        }

        this.setVolume(this.options.volume);

        // Initialize time displays
        this.updateTimeDisplays();
    }

    /**
     * Finds and caches all required DOM elements within the container
     * @returns {void}
     */
    findElements() {
        this.elements = {
            title: this.container.querySelector('.audio-player-title'),
            playPauseBtn: this.container.querySelector('.audio-player-play-pause'),
            currentTime: this.container.querySelector('.audio-player-current-time'),
            totalTime: this.container.querySelector('.audio-player-total-time'),
            progress: this.container.querySelector('.audio-player-progress'),
            progressBar: this.container.querySelector('.audio-player-progress-bar'),
            volumeBtn: this.container.querySelector('.audio-player-volume'),
        };

        // Validate required elements
        const requiredElements = ['playPauseBtn', 'currentTime', 'totalTime', 'progress', 'progressBar', 'volumeBtn'];
        for (const key of requiredElements) {
            if (!this.elements[key]) {
                console.warn(`AudioPlayer: Required element .audio-player-${key.replace(/([A-Z])/g, '-$1').toLowerCase()} not found`);
            }
        }
    }

    /**
     * Sets up a MutationObserver to detect when audio or container elements are removed from DOM
     * @returns {void}
     */
    setupDOMObserver() {
        // Watch for removal of audio or container from DOM
        this.observer = new MutationObserver((mutations) => {
            for (const mutation of mutations) {
                for (const node of mutation.removedNodes) {
                    if (node === this.audio || node === this.container ||
                        node.contains?.(this.audio) || node.contains?.(this.container)) {
                        this.destroy();
                        return;
                    }
                }
            }
        });

        // Observe the parent nodes
        const chatParent = this.audio.closest('#chat') ?? document.body;

        if (chatParent) {
            this.observer.observe(chatParent, { childList: true, subtree: true });
        }
    }

    /**
     * Binds all event listeners to audio and control elements
     * @returns {void}
     */
    bindEvents() {
        // Audio events
        this.audio.addEventListener('loadedmetadata', this.boundHandlers.audioLoadedMetadata);
        this.audio.addEventListener('timeupdate', this.boundHandlers.audioTimeUpdate);
        this.audio.addEventListener('play', this.boundHandlers.audioPlay);
        this.audio.addEventListener('pause', this.boundHandlers.audioPause);
        this.audio.addEventListener('ended', this.boundHandlers.audioEnded);
        this.audio.addEventListener('volumechange', this.boundHandlers.audioVolumeChange);

        // Control events
        if (this.elements.playPauseBtn) {
            this.elements.playPauseBtn.addEventListener('click', this.boundHandlers.playPauseClick);
        }
        if (this.elements.volumeBtn) {
            this.elements.volumeBtn.addEventListener('click', this.boundHandlers.volumeClick);
        }
        if (this.elements.progress) {
            this.elements.progress.addEventListener('mousedown', this.boundHandlers.progressMouseDown);
            this.elements.progress.addEventListener('click', this.boundHandlers.progressClick);
            this.elements.progress.addEventListener('mousemove', this.boundHandlers.progressMouseMove);
        }
    }

    /**
     * Removes all event listeners from audio and control elements
     * @returns {void}
     */
    unbindEvents() {
        // Audio events
        this.audio.removeEventListener('loadedmetadata', this.boundHandlers.audioLoadedMetadata);
        this.audio.removeEventListener('timeupdate', this.boundHandlers.audioTimeUpdate);
        this.audio.removeEventListener('play', this.boundHandlers.audioPlay);
        this.audio.removeEventListener('pause', this.boundHandlers.audioPause);
        this.audio.removeEventListener('ended', this.boundHandlers.audioEnded);
        this.audio.removeEventListener('volumechange', this.boundHandlers.audioVolumeChange);

        // Control events
        if (this.elements.playPauseBtn) {
            this.elements.playPauseBtn.removeEventListener('click', this.boundHandlers.playPauseClick);
        }
        if (this.elements.volumeBtn) {
            this.elements.volumeBtn.removeEventListener('click', this.boundHandlers.volumeClick);
        }
        if (this.elements.progress) {
            this.elements.progress.removeEventListener('mousedown', this.boundHandlers.progressMouseDown);
            this.elements.progress.removeEventListener('click', this.boundHandlers.progressClick);
            this.elements.progress.removeEventListener('mousemove', this.boundHandlers.progressMouseMove);
        }

        // Document events
        document.removeEventListener('mousemove', this.boundHandlers.documentMouseMove);
        document.removeEventListener('mouseup', this.boundHandlers.documentMouseUp);
    }

    // Audio event handlers
    /**
     * Handles the audio element's loadedmetadata event
     * @returns {void}
     */
    onAudioLoadedMetadata() {
        if (this.isDestroyed) return;
        this.updateTimeDisplays();
    }

    /**
     * Handles the audio element's timeupdate event
     * @returns {void}
     */
    onAudioTimeUpdate() {
        if (this.isDestroyed || this.isDragging) return;

        const percent = (this.audio.currentTime / this.audio.duration) * 100 || 0;
        if (this.elements.progressBar) {
            /** @type {HTMLElement} */ (this.elements.progressBar).style.width = percent + '%';
        }
        if (this.elements.currentTime) {
            this.elements.currentTime.textContent = formatTime(this.audio.currentTime);
        }

        if (typeof this.options.onTimeUpdate === 'function') {
            this.options.onTimeUpdate.call(this, this.audio.currentTime, this.audio.duration);
        }
    }

    /**
     * Handles the audio element's play event
     * @returns {void}
     */
    onAudioPlay() {
        if (this.isDestroyed) return;

        if (this.elements.playPauseBtn) {
            this.elements.playPauseBtn.classList.remove('fa-play');
            this.elements.playPauseBtn.classList.add('fa-pause');
            this.elements.playPauseBtn.setAttribute('title', 'Pause');
        }

        if (typeof this.options.onPlay === 'function') {
            this.options.onPlay.call(this);
        }
    }

    /**
     * Handles the audio element's pause event
     * @returns {void}
     */
    onAudioPause() {
        if (this.isDestroyed) return;

        if (this.elements.playPauseBtn) {
            this.elements.playPauseBtn.classList.remove('fa-pause');
            this.elements.playPauseBtn.classList.add('fa-play');
            this.elements.playPauseBtn.setAttribute('title', 'Play');
        }

        if (typeof this.options.onPause === 'function') {
            this.options.onPause.call(this);
        }
    }

    /**
     * Handles the audio element's ended event
     * @returns {void}
     */
    onAudioEnded() {
        if (this.isDestroyed) return;

        if (this.elements.playPauseBtn) {
            this.elements.playPauseBtn.classList.remove('fa-pause');
            this.elements.playPauseBtn.classList.add('fa-play');
            this.elements.playPauseBtn.setAttribute('title', 'Play');
        }

        if (typeof this.options.onEnded === 'function') {
            this.options.onEnded.call(this);
        }
    }

    /**
     * Handles the audio element's volumechange event
     * @returns {void}
     */
    onAudioVolumeChange() {
        if (this.isDestroyed) return;

        this.updateVolumeIcon();

        if (typeof this.options.onVolumeChange === 'function') {
            this.options.onVolumeChange.call(this, this.audio.volume, this.audio.muted);
        }
    }

    // Control event handlers
    /**
     * Handles click events on the play/pause button
     * @param {MouseEvent} e - The click event
     * @returns {void}
     */
    onPlayPauseClick(e) {
        e.preventDefault();
        this.togglePlay();
    }

    /**
     * Handles click events on the volume button
     * @param {MouseEvent} e - The click event
     * @returns {void}
     */
    onVolumeClick(e) {
        e.preventDefault();
        this.toggleMute();
    }

    /**
     * Handles input events on the volume slider
     * @param {InputEvent} e - The input event
     * @returns {void}
     */
    onVolumeInput(e) {
        if (!(e.target instanceof HTMLInputElement)) return;
        const value = parseFloat(e.target.value);
        this.setVolume(value);
    }

    /**
     * Handles mousedown events on the progress bar
     * @param {MouseEvent} e - The mousedown event
     * @returns {void}
     */
    onProgressMouseDown(e) {
        this.isDragging = true;
        this.updateProgress(e);
        document.addEventListener('mousemove', this.boundHandlers.documentMouseMove);
        document.addEventListener('mouseup', this.boundHandlers.documentMouseUp);
    }

    /**
     * Handles click events on the progress bar
     * @param {MouseEvent} e - The click event
     * @returns {void}
     */
    onProgressClick(e) {
        if (!this.isDragging) {
            this.updateProgress(e);
        }
    }

     * Handles mousemove on the progress bar (no-op if dragging)
     * @param {MouseEvent} e - The mousemove event
     * @returns {void}
     */

            this.updateProgressTitle(e);
        }
    }

        }

        const offsetX = e.clientX - rect.left;
        const width = rect.width;

                this.elements.currentTime.textContent = formatTime(seekTime);
            }
        }
    }

    /**
     * Updates the volume icon based on current volume and mute state
     * @returns {void}
     */
    updateVolumeIcon() {
        if (!this.elements.volumeBtn) return;

        const volume = this.audio.volume;
        const isMuted = this.audio.muted;

        this.elements.volumeBtn.classList.remove('fa-volume-high', 'fa-volume-low', 'fa-volume-off', 'fa-volume-xmark');

        if (isMuted || volume === 0) {
            this.elements.volumeBtn.classList.add('fa-volume-xmark');
        } else if (volume < 0.5) {
            this.elements.volumeBtn.classList.add('fa-volume-low');
        } else {
            this.elements.volumeBtn.classList.add('fa-volume-high');
        }
    }

    /**
     * Updates the current time and total time display elements
     * @returns {void}
     */
    updateTimeDisplays() {
        if (this.elements.currentTime) {
            this.elements.currentTime.textContent = formatTime(this.audio.currentTime || 0);
        }
        if (this.elements.totalTime) {
            this.elements.totalTime.textContent = formatTime(this.audio.duration || 0);
        }
    }

    /**
     * Updates the mouseover title on the progress bar to show time at cursor position
     * @param {MouseEvent} e - The mouse event
     * @returns {void}
     */
    updateProgressTitle(e) {
        if (!this.elements.progress) return;

        const rect = this.elements.progress.getBoundingClientRect();
        const offsetX = e.clientX - rect.left;
        const width = rect.width;
        const percent = Math.max(0, Math.min(100, (offsetX / width) * 100));

     * Pauses audio playback
     * @returns {void}
     */

        if (!this.audio.paused) {

        }
    }

    /**
     * Toggles between play and pause states
     * @returns {void}
     */
    togglePlay() {
        if (this.audio.paused) {
            this.play();
        } else {
            this.pause();
        }
    }

    /**
     * Seeks to a specific time in the audio
     * @param {number} time - The time in seconds to seek to
     * @returns {void}
     */
    seek(time) {
        if (this.isDestroyed) return;
        if (isFinite(time) && time >= 0 && time <= this.audio.duration) {
            this.audio.currentTime = time;
        }
    }

    /**
     * Sets the volume level
     * @param {number} volume - Volume level between 0.0 and 1.0
     * @returns {void}
     */
    setVolume(volume) {
        if (this.isDestroyed) return;
        volume = Math.max(0, Math.min(1, volume));
        this.audio.volume = volume;

        if (volume > 0 && this.audio.muted) {

        }
    }

    /**
     * Mutes the audio
     * @returns {void}
     */
    mute() {
        if (this.isDestroyed) return;
        this.audio.muted = true;
    }

    /**
     * Unmutes the audio
     * @returns {void}
     */
    unmute() {
        if (this.isDestroyed) return;
        this.audio.muted = false;
    }

    /**
     * Toggles the mute state
     * @returns {void}
     */
    toggleMute() {
        if (this.isDestroyed) return;
        this.audio.muted = !this.audio.muted;
    }

    /**
     * Sets the audio source URL
     * @param {string} src - The URL of the audio file
     * @returns {void}
     */
    setSrc(src) {
        if (this.isDestroyed) return;
        this.audio.src = src;
    }

    /**
     * Sets the title displayed in the player
     * @param {string} title - The title text to display
     * @returns {void}
     */
    setTitle(title) {
        if (this.isDestroyed) return;
        this.options.title = title;
        if (this.elements.title) {
            this.elements.title.textContent = title;
        }
    }

    /**
     * Cleans up the player by removing event listeners and clearing references
     * @returns {void}
     */
    destroy() {
        if (this.isDestroyed) return;
        this.isDestroyed = true;

        // Stop observing DOM changes
        if (this.observer) {
            this.observer.disconnect();
            this.observer = null;
        }

        // Pause and clear audio
        this.pause();
        this.audio.src = '';

        // Remove all event listeners
        this.unbindEvents();

        // Clear references to prevent memory leaks
        this.audio = null;
        this.container = null;
        this.elements = null;
        this.options = null;
        this.boundHandlers = null;
    }
}
