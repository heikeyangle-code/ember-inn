name: Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'engine/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/**'
      - 'scripts/kernel-golden/**'
      - 'scripts/th-golden/**'
      - 'scripts/source-scan/**'
  pull_request:
    paths:
      - 'app/**'
      - 'engine/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/**'
      - 'scripts/kernel-golden/**'
      - 'scripts/th-golden/**'
      - 'scripts/source-scan/**'

jobs:
  engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Engine unit tests
        run: chmod +x gradlew && ./gradlew :engine:test --no-daemon

  kernel-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Kernel golden tests (jsdom)
        run: cd scripts/kernel-golden && npm ci && npm test
      - name: Kernel DOM golden tests (Puppeteer/Chromium, V2 §六.2)
        run: cd scripts/kernel-golden && npm run test:dom
      - name: TavernHelper contract tests (jsdom)
        run: cd scripts/th-golden && npm install --no-save jsdom@24 && node contract.test.mjs
      - name: Token gate (业务层禁直读 M3 colorScheme, DESIGN_SYSTEM §六)
        run: node scripts/source-scan/check-tokens.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Create release keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v -keystore keystore/release.jks -alias emberinn -keyalg RSA -keysize 2048 -validity 10000 -storepass emberinn -keypass emberinn -dname "CN=EmberInn, OU=CI, O=EmberInn, L=City, S=State, C=CN"
      - name: Unit tests + Build APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.jks
          ANDROID_KEYSTORE_PASSWORD: emberinn
          ANDROID_KEY_ALIAS: emberinn
          ANDROID_KEY_PASSWORD: emberinn
        run: chmod +x gradlew && ./gradlew test assembleDebug assembleRelease --no-daemon
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ember-inn-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
